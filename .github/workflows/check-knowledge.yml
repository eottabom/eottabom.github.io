name: "🕸️ Check Knowledge"

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "contents/posts/**"
      - "lib/knowledge/**"
      - "scripts/check-knowledge.ts"
      - "scripts/classify-knowledge.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate knowledge data and tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate knowledge graph data
        run: npm run check:knowledge

      - name: Run unit tests
        run: npm test
