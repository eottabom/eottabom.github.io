version: 2

# 업데이트 정책
# - 보안 취약점: 저장소 설정의 Dependabot security updates 가 즉시 별도 PR 을 올린다.
# - 정기 버전 업데이트: 매월 1일에 생태계당 최대 2개의 PR 로만 올라온다.
#     1) minor-and-patch : minor/patch 를 전부 묶은 PR
#     2) major           : major 를 전부 묶은 PR
#   open-pull-requests-limit 도 2 로 맞춰서, 앞선 PR 을 처리하기 전에는
#   새 PR 이 생기지 않는다. (PR 이 쌓이지 않게 하는 장치)

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
