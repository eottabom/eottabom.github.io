version: 2

# 업데이트 정책
# - 보안 취약점: 저장소 설정의 Dependabot security updates 가 즉시 PR 을 올린다.
# - 정기 버전 업데이트: 아래 설정으로 매월 1일에 PR 하나로 묶어서 올린다.
#   minor/patch 는 PR 하나로 묶고, major 는 묶지 않아 개별 PR 로 올라온다.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
